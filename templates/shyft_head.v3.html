       admin incentive points, take/trade marketplace, lock-time point crediting. Has its
       own storage namespace ("shyft3_*") with a one-time importer from v2's "shyft_*". -->
  <meta name="generator" content="SHIFT Scheduling v3"/>

  <style>
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #F1F5F9; color: #0F172A; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

<body>
  <div id="root"></div>

  <script>
    // One-time v2 → v3 import. Copies every "shyft_*" key into "shyft3_*" (without overwriting
    // anything v3 has already written), then upgrades each group's config to add `phase` to
    // every block (signupOpen:true → "availability", false → "reconciliation"). v2 keeps its own
    // storage untouched so it can keep running side-by-side.
    (function(){
      const MARKER = "shyft3_migrate_from_v2";
      if (localStorage.getItem(MARKER) === "done") return;
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      keys.forEach(k => {
        if (k.startsWith("shyft_") && !k.startsWith("shyft3_")) {
          const v3Key = "shyft3_" + k.slice("shyft_".length);
          if (localStorage.getItem(v3Key) === null) {
            localStorage.setItem(v3Key, localStorage.getItem(k));
          }
        }
      });
      // Walk imported group configs and stamp phase onto every block.
      const v3Keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("shyft3_") && k.endsWith("_config")) v3Keys.push(k);
      }
      v3Keys.forEach(k => {
        try {
          const cfg = JSON.parse(localStorage.getItem(k));
          if (cfg && Array.isArray(cfg.blocks)) {
            let mutated = false;
            cfg.blocks = cfg.blocks.map(b => {
              if (b && b.phase) return b;
              mutated = true;
              const phase = b && b.signupOpen ? "availability" : "reconciliation";
              return { ...b, phase };
            });
            if (mutated) localStorage.setItem(k, JSON.stringify(cfg));
          }
        } catch(e) { /* malformed config — leave it for the app to repair */ }
      });
      localStorage.setItem(MARKER, "done");
    })();

    // One-shot D.3 cleanup: pre-D.3 devices stored local owner accounts under "shyft3_supers".
    // That code path is gone (auth is cloud-backed now), so the key is inert. Prune it once.
    (function(){
      const MARKER = "shyft3_migrate_prune_supers";
      if (localStorage.getItem(MARKER) === "done") return;
      localStorage.removeItem("shyft3_supers");
      localStorage.setItem(MARKER, "done");
    })();

    // Storage shim — v3 owns the "shyft3_*" namespace exclusively.
    window.storage = {
      get: async (key) => {
        const val = localStorage.getItem("shyft3_" + key);
        return val ? { value: val } : null;
      },
      set: async (key, val) => {
        localStorage.setItem("shyft3_" + key, val);
      }
    };

    // Cloud API helper. Same-origin fetch with the CSRF header the Worker requires.
    // Phase A only — used by the cloud sign-in flow. localStorage is still source of truth.
    window.api = {
      async fetchJSON(path, opts = {}) {
        const res = await fetch(path, {
          ...opts,
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "shift",
            ...(opts.headers || {}),
          },
        });
        if (res.status === 204) return null;
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          const e = new Error(body.error || ("HTTP " + res.status));
          e.status = res.status;
          e.body = body;
          throw e;
        }
        return body;
      },
    };

    // ─── D.4.D1: event outbox ────────────────────────────────────────────────
    // Failed POST /api/events calls get parked in localStorage and retried on
    // the next visibilitychange/`online` event. Cheap insurance for offline
    // edits and a stepping-stone to D.4.D2 where cloud becomes authoritative.
    // 4xx errors are dropped (replaying won't help); transport failures + 5xx +
    // 408/429 are retried. Idempotency caveat: the server currently mints
    // event ids server-side, so a retry that already committed on the server
    // creates a duplicate row — fine here because the outbox only fires on
    // genuine transport failures (the request never reached the server).
    // D.4.D2 will tighten this with client-issued ids + INSERT-IGNORE.
    const OUTBOX_KEY = "shyft3_evt_outbox";
    const OUTBOX_CAP = 500;
    function readEventOutbox() {
      try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]"); } catch { return []; }
    }
    function writeEventOutbox(q) {
      try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(q.slice(-OUTBOX_CAP))); } catch {}
    }
    async function postEventOnce(body) {
      // → "ok" (accepted), "drop" (permanent reject), "retry" (worth retrying).
      try {
        const res = await fetch("/api/events", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "shift",
          },
          body: JSON.stringify(body),
        });
        if (res.ok || res.status === 204) return "ok";
        if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429) return "drop";
        return "retry";
      } catch {
        return "retry"; // offline, DNS failure, etc.
      }
    }
    window.api.postEvent = async function postEvent(body) {
      const r = await postEventOnce(body);
      if (r === "retry") {
        const q = readEventOutbox();
        q.push(body);
        writeEventOutbox(q);
      }
    };
    let _flushingOutbox = false;
    async function flushEventOutbox() {
      if (_flushingOutbox) return;
      _flushingOutbox = true;
      try {
        let q = readEventOutbox();
        while (q.length) {
          const head = q[0];
          const r = await postEventOnce(head);
          if (r === "retry") break;
          q = q.slice(1);
          writeEventOutbox(q);
        }
      } finally {
        _flushingOutbox = false;
      }
    }
    window.api.flushEventOutbox = flushEventOutbox;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") flushEventOutbox();
    });
    window.addEventListener("online", flushEventOutbox);
    // Drain anything left over from a previous session as soon as the runtime is ready.
    queueMicrotask(flushEventOutbox);
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    const DAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const DAYS_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const COLORS = ["#3B82F6","#8B5CF6","#EC4899","#10B981","#F59E0B","#EF4444","#06B6D4","#84CC16","#F97316","#A855F7"];
    const UNAVAIL_REASONS = ["Working","Vacation","Conference","Personal Conflict"];

    // ── Phase state machine ─────────────────────────────────────────────────────
    // Each block lives in exactly one phase. Transitions are admin-driven and one-way
    // (with a confirm-revert from reconciliation back to availability that wipes assignments).
    //   availability    — providers edit availability/preferences/pools/bids
    //   reconciliation  — assignments are computed and frozen; users confirm/flag; trades open
    //   locked          — points formally distributed; trades still allowed for adjustments
    const PHASE = { AVAIL: "availability", RECON: "reconciliation", LOCKED: "locked" };
    const PHASE_LABEL = {
      [PHASE.AVAIL]: "Availability",
      [PHASE.RECON]: "Reconciliation",
      [PHASE.LOCKED]: "Locked",
    };
    const PHASE_DESC = {
      [PHASE.AVAIL]: "Providers are entering availability and setting Top Options",
      [PHASE.RECON]: "Assignments are out — providers can confirm or flag, trades are open",
      [PHASE.LOCKED]: "Points are distributed — trades and admin adjustments still allowed",
    };
    const PHASE_TONE = {
      // Tailwind utility set per phase, used by phase-pill chrome.
      [PHASE.AVAIL]: { bg: "bg-emerald-50", text: "text-emerald-700", border: "border-emerald-200", dot: "bg-emerald-500" },
      [PHASE.RECON]: { bg: "bg-amber-50",   text: "text-amber-800",   border: "border-amber-200",   dot: "bg-amber-500"   },
      [PHASE.LOCKED]:{ bg: "bg-slate-100",  text: "text-slate-700",   border: "border-slate-300",   dot: "bg-slate-500"   },
    };
    const phaseOf = b => (b && b.phase) || PHASE.AVAIL;
    const isAvailabilityOpen = b => phaseOf(b) === PHASE.AVAIL;
    const isReconciling = b => phaseOf(b) === PHASE.RECON;
    const isLocked = b => phaseOf(b) === PHASE.LOCKED;

    const DEFAULT_CONFIG = {
      blocks: [], currentBlockId: null,
      // `signupOpen` no longer exists on the config — phase lives on each block in `blocks[].phase`.
      // Legacy `blockStart`/`blockEnd` remain only for the legacy-fallback synthetic block (single
      // pre-multitenant block, gradually phased out). New blocks always go in `blocks[]`.
      blockStart: "", blockEnd: "",
      shiftSlots: [
        { id: 1, name: "Primary", credit: 1.0, color: "#F59E0B" },
        { id: 2, name: "Backup", credit: 1.0, color: "#8B5CF6" },
      ],
      pointValues: { weekday: 1, fri: 2, sat: 3, sun: 2, holiday: 4 },
      pointValuesLocked: true,
      holidays: {},
      seniorityLevels: [
        { id: 1, name: "Senior", minShifts: 2 },
        { id: 2, name: "Junior", minShifts: 3 },
      ],
      // Two distinct availability rules: (1) must PREFER ≥N days, (2) may BLOCK ≤N days. Falling
      // short on (1) costs preferredShortfallPenalty; going over on (2) costs blockOverLimitPenalty/day.
      // Penalties are previewed live but only deducted when admin runs Close & assign — providers
      // can keep editing their availability up to that moment without being gated out of bidding.
      minPreferredDays: 6, minPreferredWeekendDays: 2, preferredShortfallPenalty: 1,
      maxBlockedDays: 14, maxBlockedWeekendDays: 4, blockOverLimitPenalty: 1,
      nonPreferredBonus: 1,
    };

    async function sha256(s) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    const dk = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const parseDk = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
    const dim = (y, m) => new Date(y, m+1, 0).getDate();
    const fdow = (y, m) => new Date(y, m, 1).getDay();
    const initials = n => n.split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase();
    const isWeekend = k => { const d = parseDk(k).getDay(); return d===0||d===6; };
    const getUid = e => (typeof e==="object"&&e!==null)?(e.uid??null):e;
    const isAuto = e => typeof e==="object"&&e!==null&&!!e.auto;
    // v3.1 — entries are award-only. The pool/bid concept moved to a per-day topOptions map,
    // so the legacy module-scope helpers (getPool, inPool, poolSize, getBid, setEntryBid,
    // clearEntryBid, DEFAULT_BID) are gone. Component-level helpers replace them — see
    // inTopOption/dayTopOptionerCount/getDayBid/etc. inside the ShiftApp component.
    // Awarded entries carry a `source` tag indicating how they were filled, used for the post-block
    // report. Tags: "pool" (top-bidder won), "pool-solo" (single Top-Optioner), "cascade" (took the
    // other open slot after losing slot pref), "preferred-auto" (auto-filled on a starred date),
    // "available-auto" (auto-filled on an available non-preferred date), "auto-swap" (replaced a
    // flagged provider), "marketplace" (taken via the trade marketplace), "admin" (manual override).
    const getSource = e => {
      if(!e || !getUid(e)) return null;
      if(e.source) return e.source;
      if(isAuto(e)) return "unknown-auto";
      return "unknown-manual";
    };

    const dayPts = (date, cfg) => {
      const k = dk(date.getFullYear(), date.getMonth(), date.getDate());
      if (cfg.holidays[k]) return cfg.pointValues.holiday;
      const dow = date.getDay();
      if (dow===5) return cfg.pointValues.fri;
      if (dow===6) return cfg.pointValues.sat;
      if (dow===0) return cfg.pointValues.sun;
      return cfg.pointValues.weekday;
    };

    const currentBlockOf = cfg => {
      if(cfg.currentBlockId && Array.isArray(cfg.blocks)){
        const b = cfg.blocks.find(x => x.id === cfg.currentBlockId);
        if(b) return b;
      }
      // Legacy single-block fallback — only kicks in when there are no blocks[] entries at all.
      // Synthesizes a phase based on the deprecated `signupOpen` boolean if it's still around.
      if(cfg.blockStart && cfg.blockEnd) {
        const phase = cfg.signupOpen ? PHASE.AVAIL : PHASE.RECON;
        return { id:"legacy", name:"Block", start:cfg.blockStart, end:cfg.blockEnd, phase };
      }
      return null;
    };
    const inBlock = (k, cfg) => { const b = currentBlockOf(cfg); return !!(b && k >= b.start && k <= b.end); };

    const gKey = (gid, k) => `g${gid}_${k}`;
    const genCode = (len=6) => { const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<len;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };

    // ════════════════════════════════════════════════════════════════════════════
    // D.4.C — applyEvent reducer (pure event-log replay)
    //
    // Mirror of the same block in ShiftApp.v3.jsx preamble. This file is the
    // runtime canonical copy; the preamble exists only for IDE readability.
    // Used today by window.__shiftValidator; the D.4.D2 cutover routes every
    // mutation through applyEvent.
    //
    // Determinism contract: NO Date.now(), NO Math.random(), NO localStorage,
    // NO React state. Every non-deterministic input (entity ids, postedAt
    // timestamps, generated linkIds) must come from evt.id / evt.payload /
    // evt.clientTs. Handlers that mutate must take only (state, evt) and return
    // a new state object.
    //
    // Idempotency: applyEvent silently no-ops if evt.id is already in
    // state.appliedEventIds (FIFO ring buffer, cap APPLIED_EVENTS_CAP).
    //
    // State shape (matches what applySnapshot writes through to localStorage,
    // plus the ring buffer):
    //   { users, shifts, unavailability, preferences, topOptions, marketplace,
    //     openIncentives, config, appliedEventIds }
    //
    // Event shape (matches GET /api/events response items):
    //   { id, type, userId, localUid, blockId, clientTs, serverTs, payload }
    // ════════════════════════════════════════════════════════════════════════════

    const APPLIED_EVENTS_CAP = 200;

    // Normalize a uid coming off the wire (where producers stringify defensively, and the
    // Worker's events.js also stores localUid as TEXT) back to the numeric form used in
    // state. user.id throughout v3 is a Date.now()-style integer; entry.uid and the
    // swappedFrom/takenFrom/sellerId fields all need to match that type or shadow-diff
    // catches a string-vs-number mismatch. Non-numeric values (future UUIDs) pass through
    // unchanged so the helper stays safe if we ever broaden the id space.
    function uidVal(v) {
      if (v == null) return null;
      if (typeof v === "number") return v;
      const n = +v;
      return Number.isFinite(n) ? n : v;
    }

    function trackAppliedEventId(prev, id) {
      const arr = Array.isArray(prev) ? prev : [];
      if (arr.includes(id)) return arr;
      const next = arr.length >= APPLIED_EVENTS_CAP
        ? [...arr.slice(arr.length - APPLIED_EVENTS_CAP + 1), id]
        : [...arr, id];
      return next;
    }

    // Remove uid's entry from one day's topOptions map; drop the day if empty.
    function removeTopOptionEntry(topOptions, dateKey, uid) {
      const dayMap = { ...(topOptions[dateKey] || {}) };
      delete dayMap[uid];
      delete dayMap[String(uid)];
      const next = { ...topOptions };
      if (Object.keys(dayMap).length) next[dateKey] = dayMap;
      else delete next[dateKey];
      return next;
    }

    // Re-stamp linkIds on a sub-chain of dates for one uid (used by .clear / .unlink).
    function stampChainLinkIds(topOptions, dates, uid, lid) {
      if (!Array.isArray(dates) || !dates.length) return topOptions;
      const next = { ...topOptions };
      for (const dk of dates) {
        const en = next[dk]?.[uid] || next[dk]?.[String(uid)];
        const key = en ? (uid in (next[dk] || {}) ? uid : String(uid)) : null;
        if (!en || !key) continue;
        if (lid) {
          if (en.linkId === lid) continue;
          next[dk] = { ...next[dk], [key]: { ...en, linkId: lid } };
        } else {
          if (en.linkId == null) continue;
          const { linkId: _drop, ...rest } = en;
          next[dk] = { ...next[dk], [key]: rest };
        }
      }
      return next;
    }

    // Apply award entries from block.reconcile to the shifts map.
    function applyAwardsToShifts(shifts, awards) {
      if (!Array.isArray(awards) || !awards.length) return shifts;
      const next = { ...shifts };
      for (const a of awards) {
        if (!a || !a.dateKey || a.uid == null) continue;
        const day = next[a.dateKey] ? { ...next[a.dateKey] } : {};
        day[a.slotId] = {
          uid: a.uid,
          auto: false,
          source: a.source || "pool",
          ...(a.bid != null ? { bid: a.bid } : {}),
          confirm: null,
        };
        next[a.dateKey] = day;
      }
      return next;
    }

    // Apply bid deltas + penalties + incentive credits to users.points in a single pass.
    function applyPointsCascade(users, deltas, penalties, incCredits) {
      const has = (m, u) => m && (m[u.id] !== undefined || m[String(u.id)] !== undefined);
      const get = (m, u) => m ? (m[u.id] ?? m[String(u.id)] ?? 0) : 0;
      const anyMap = m => m && Object.keys(m).length > 0;
      if (!anyMap(deltas) && !anyMap(penalties) && !anyMap(incCredits)) return users;
      return users.map(u => {
        if (!has(deltas, u) && !has(penalties, u) && !has(incCredits, u)) return u;
        const bid = get(deltas, u);
        const pen = get(penalties, u);
        const inc = get(incCredits, u);
        if (bid === 0 && pen === 0 && inc === 0) return u;
        return { ...u, points: Math.max(0, (u.points || 0) + bid + inc - pen) };
      });
    }

    // Clear the (dateKey, slotId) entries listed in block.reconcile.openIncentivesPatch.consumed.
    function applyOpenIncentivesPatch(openIncentives, patch) {
      if (!patch || !Array.isArray(patch.consumed) || !patch.consumed.length) return openIncentives;
      const next = { ...openIncentives };
      for (const c of patch.consumed) {
        const day = next[c.dateKey];
        if (!day) continue;
        const nextDay = { ...day };
        delete nextDay[c.slotId];
        delete nextDay[String(c.slotId)];
        if (Object.keys(nextDay).length) next[c.dateKey] = nextDay;
        else delete next[c.dateKey];
      }
      return next;
    }

    // Patch one block's fields by id within config.blocks[].
    function patchBlockInConfig(config, blockId, patch) {
      if (!config || !Array.isArray(config.blocks)) return config;
      const blocks = config.blocks.map(b => String(b.id) === String(blockId) ? { ...b, ...patch } : b);
      return { ...config, blocks };
    }

    // Close any open auto-posted listing for a (dateKey, slotId) and stale its pending offers.
    function closeAutoListingFor(marketplace, dateKey, slotId) {
      let changed = false;
      const next = marketplace.map(l => {
        if (l.dateKey === dateKey && Number(l.slotId) === Number(slotId) && l.status === "open" && l.autoPosted) {
          changed = true;
          return {
            ...l,
            status: "cancelled",
            tradeOffers: (l.tradeOffers || []).map(o => o.status === "pending" ? { ...o, status: "stale" } : o),
          };
        }
        return l;
      });
      return changed ? next : marketplace;
    }

    const EVENT_HANDLERS = {

      "topOption.set": (s, e) => {
        const { dateKey, slotPref, bid } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || uid == null) return s;
        const dayCur = s.topOptions[dateKey] || {};
        const existing = dayCur[uid] || dayCur[String(uid)];
        const wasIn = !!existing;
        const merged = { ...(existing || {}), bid: bid ?? 1, slotPref: slotPref ?? null };
        const key = wasIn ? (uid in dayCur ? uid : String(uid)) : uid;
        const nextDay = { ...dayCur, [key]: merged };
        let next = { ...s, topOptions: { ...s.topOptions, [dateKey]: nextDay } };
        // First-time set also auto-marks the day preferred (mirrors setTopOption live cascade).
        if (!wasIn) {
          const prefKey = (next.preferences[uid] !== undefined) ? uid : (next.preferences[String(uid)] !== undefined ? String(uid) : uid);
          const pcur = next.preferences[prefKey] || [];
          if (!pcur.includes(dateKey)) {
            next = { ...next, preferences: { ...next.preferences, [prefKey]: [...pcur, dateKey] } };
          }
        }
        return next;
      },

      "topOption.clear": (s, e) => {
        const { dateKey, chainRepair } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || uid == null) return s;
        let nextTops = removeTopOptionEntry(s.topOptions, dateKey, uid);
        if (chainRepair) {
          nextTops = stampChainLinkIds(nextTops, chainRepair.left, uid, chainRepair.leftLid);
          nextTops = stampChainLinkIds(nextTops, chainRepair.right, uid, chainRepair.rightLid);
        }
        return { ...s, topOptions: nextTops };
      },

      "topOption.link": (s, e) => {
        const { dateKey, withDateKey, linkId } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || !withDateKey || !linkId || uid == null) return s;
        const aLid = s.topOptions[dateKey]?.[uid]?.linkId || s.topOptions[dateKey]?.[String(uid)]?.linkId || null;
        const bLid = s.topOptions[withDateKey]?.[uid]?.linkId || s.topOptions[withDateKey]?.[String(uid)]?.linkId || null;
        const oldLids = new Set([aLid, bLid].filter(Boolean));
        const nextTops = { ...s.topOptions };
        let mutated = false;
        for (const dk of Object.keys(nextTops)) {
          const dayMap = nextTops[dk] || {};
          const k = (uid in dayMap) ? uid : (String(uid) in dayMap ? String(uid) : null);
          if (!k) continue;
          const en = dayMap[k];
          if (!en?.linkId) continue;
          if (oldLids.has(en.linkId) && en.linkId !== linkId) {
            nextTops[dk] = { ...dayMap, [k]: { ...en, linkId } };
            mutated = true;
          }
        }
        for (const dk of [dateKey, withDateKey]) {
          const dayMap = nextTops[dk] || {};
          const k = (uid in dayMap) ? uid : (String(uid) in dayMap ? String(uid) : null);
          if (!k) continue;
          const en = dayMap[k];
          if (!en || en.linkId === linkId) continue;
          nextTops[dk] = { ...dayMap, [k]: { ...en, linkId } };
          mutated = true;
        }
        return mutated ? { ...s, topOptions: nextTops } : s;
      },

      "topOption.unlink": (s, e) => {
        const { chainRepair } = e.payload || {};
        const uid = e.localUid;
        if (!chainRepair || uid == null) return s;
        let nextTops = stampChainLinkIds(s.topOptions, chainRepair.left, uid, chainRepair.leftLid);
        nextTops = stampChainLinkIds(nextTops, chainRepair.right, uid, chainRepair.rightLid);
        return { ...s, topOptions: nextTops };
      },

      "preference.toggle": (s, e) => {
        const { dateKey, wanted } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || uid == null) return s;
        const prefKey = (uid in s.preferences) ? uid : (String(uid) in s.preferences ? String(uid) : uid);
        const cur = s.preferences[prefKey] || [];
        const has = cur.includes(dateKey);
        if (wanted && !has) {
          return { ...s, preferences: { ...s.preferences, [prefKey]: [...cur, dateKey] } };
        }
        if (!wanted && has) {
          let next = { ...s, preferences: { ...s.preferences, [prefKey]: cur.filter(d => d !== dateKey) } };
          // Removing preferred also clears the Top Option (mirrors togglePreference live cascade).
          if (next.topOptions[dateKey]?.[uid] || next.topOptions[dateKey]?.[String(uid)]) {
            next = { ...next, topOptions: removeTopOptionEntry(next.topOptions, dateKey, uid) };
          }
          return next;
        }
        return s;
      },

      "unavail.toggle": (s, e) => {
        const { dateKey, blocked } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || uid == null) return s;
        const unavailKey = (uid in s.unavailability) ? uid : (String(uid) in s.unavailability ? String(uid) : uid);
        const cur = { ...(s.unavailability[unavailKey] || {}) };
        if (blocked) {
          cur[dateKey] = null;
          let next = { ...s, unavailability: { ...s.unavailability, [unavailKey]: cur } };
          // Blocking also drops the preference for the day (mirrors _applyToggleUnavail).
          const prefKey = (uid in next.preferences) ? uid : (String(uid) in next.preferences ? String(uid) : null);
          if (prefKey != null) {
            const pcur = next.preferences[prefKey] || [];
            if (pcur.includes(dateKey)) {
              next = { ...next, preferences: { ...next.preferences, [prefKey]: pcur.filter(d => d !== dateKey) } };
            }
          }
          return next;
        } else {
          delete cur[dateKey];
          return { ...s, unavailability: { ...s.unavailability, [unavailKey]: cur } };
        }
      },

      "unavail.reason": (s, e) => {
        const { dateKey, reason } = e.payload || {};
        const uid = e.localUid;
        if (!dateKey || uid == null) return s;
        const unavailKey = (uid in s.unavailability) ? uid : (String(uid) in s.unavailability ? String(uid) : null);
        if (unavailKey == null) return s;
        const cur = s.unavailability[unavailKey] || {};
        if (!(dateKey in cur)) return s;
        return {
          ...s,
          unavailability: { ...s.unavailability, [unavailKey]: { ...cur, [dateKey]: reason ?? null } },
        };
      },

      "block.reconcile": (s, e) => {
        const p = e.payload || {};
        let next = { ...s, shifts: applyAwardsToShifts(s.shifts, p.awards) };
        const incCredits = p.openIncentivesPatch?.credits || {};
        next = {
          ...next,
          users: applyPointsCascade(next.users, p.deltas, p.availPenalties, incCredits),
          openIncentives: applyOpenIncentivesPatch(next.openIncentives, p.openIncentivesPatch),
        };
        if (p.blockId) {
          next = {
            ...next,
            config: patchBlockInConfig(next.config, p.blockId, {
              phase: "reconciliation",
              lastReconcileDeltas: p.deltas || {},
              pointsAtClose: p.pointsAtClose || null,
              availPenalties: p.availPenalties || {},
            }),
          };
        }
        return next;
      },

      "block.lock": (s, e) => {
        const blockId = e.payload?.blockId || e.blockId;
        if (!blockId) return s;
        return { ...s, config: patchBlockInConfig(s.config, blockId, { phase: "locked" }) };
      },

      "block.unlock": (s, e) => {
        const blockId = e.payload?.blockId || e.blockId;
        if (!blockId) return s;
        return { ...s, config: patchBlockInConfig(s.config, blockId, { phase: "reconciliation" }) };
      },

      "block.reset": (s, e) => {
        const p = e.payload || {};
        let nextShifts = s.shifts;
        if (Array.isArray(p.clearedDateKeys) && p.clearedDateKeys.length) {
          nextShifts = { ...s.shifts };
          for (const k of p.clearedDateKeys) delete nextShifts[k];
        }
        // Reverse bid charges + restore penalty deductions per resetBlock live logic.
        const restored = p.restoredDeltas || {};
        const restoredPenalties = p.restoredPenalties || {};
        const touched = new Set([...Object.keys(restored), ...Object.keys(restoredPenalties)]);
        let nextUsers = s.users;
        if (touched.size) {
          nextUsers = s.users.map(u => {
            const k = String(u.id);
            if (!touched.has(k) && !touched.has(u.id)) return u;
            const bidDelta = restored[k] ?? restored[u.id] ?? 0;
            const penalty = restoredPenalties[k] ?? restoredPenalties[u.id] ?? 0;
            if (bidDelta === 0 && penalty === 0) return u;
            return { ...u, points: Math.max(0, (u.points || 0) - bidDelta + penalty) };
          });
        }
        let nextConfig = s.config;
        if (p.blockId) {
          nextConfig = patchBlockInConfig(nextConfig, p.blockId, {
            phase: "availability",
            lastReconcileDeltas: {},
            pointsAtClose: null,
            availPenalties: {},
          });
        }
        return { ...s, shifts: nextShifts, users: nextUsers, config: nextConfig };
      },

      "shift.confirm": (s, e) => {
        const { dateKey, slotId } = e.payload || {};
        if (!dateKey || slotId == null) return s;
        const day = s.shifts[dateKey];
        const entry = day?.[slotId];
        if (!entry) return s;
        return {
          ...s,
          shifts: {
            ...s.shifts,
            [dateKey]: { ...day, [slotId]: { ...entry, confirm: "ok", flagReason: null } },
          },
        };
      },

      "shift.flag": (s, e) => {
        const { dateKey, slotId, reason, listing } = e.payload || {};
        if (!dateKey || slotId == null) return s;
        const day = s.shifts[dateKey];
        const entry = day?.[slotId];
        if (!entry) return s;
        let next = {
          ...s,
          shifts: {
            ...s.shifts,
            [dateKey]: { ...day, [slotId]: { ...entry, confirm: "flagged", flagReason: reason ?? null } },
          },
        };
        // Idempotent listing append — _postListing returns the existing listing if one is
        // already up for this slot, so the same id can be replayed safely.
        if (listing && listing.id && !s.marketplace.some(l => l.id === listing.id)) {
          next = { ...next, marketplace: [...next.marketplace, listing] };
        }
        return next;
      },

      "shift.swap-admin": (s, e) => {
        const { fromUid, toUid, dateKey, slotId } = e.payload || {};
        if (!dateKey || slotId == null) return s;
        const day = s.shifts[dateKey];
        const entry = day?.[slotId];
        if (!entry) return s;
        return {
          ...s,
          shifts: {
            ...s.shifts,
            [dateKey]: {
              ...day,
              [slotId]: { ...entry, uid: uidVal(toUid), source: "auto-swap", swappedFrom: uidVal(fromUid), confirm: null, flagReason: null },
            },
          },
          marketplace: closeAutoListingFor(s.marketplace, dateKey, slotId),
        };
      },

      "shift.trade-admin": (s, e) => {
        const { aUid, bUid, aDate, aSlot, bDate, bSlot } = e.payload || {};
        if (!aDate || aSlot == null || !bDate || bSlot == null) return s;
        const aDay = s.shifts[aDate];
        const bDay = s.shifts[bDate];
        const aEntry = aDay?.[aSlot];
        const bEntry = bDay?.[bSlot];
        if (!aEntry || !bEntry) return s;
        return {
          ...s,
          shifts: {
            ...s.shifts,
            [aDate]: { ...aDay, [aSlot]: { ...aEntry, uid: uidVal(bUid), source: "auto-trade", swappedFrom: uidVal(aUid), confirm: null, flagReason: null } },
            [bDate]: { ...(s.shifts[bDate] || {}), [bSlot]: { ...bEntry, uid: uidVal(aUid), source: "auto-trade", swappedFrom: uidVal(bUid), confirm: null, flagReason: null } },
          },
          marketplace: closeAutoListingFor(s.marketplace, aDate, aSlot),
        };
      },

      "marketplace.post": (s, e) => {
        const { dateKey, slotId, incentivePts, listingId } = e.payload || {};
        if (!listingId || !dateKey || slotId == null) return s;
        if (s.marketplace.some(l => l.id === listingId)) return s;
        const entry = s.shifts[dateKey]?.[slotId];
        const sellerId = entry ? (typeof entry === "object" ? entry.uid : entry) : null;
        if (sellerId == null) return s;
        const listing = {
          id: listingId,
          dateKey,
          slotId,
          sellerId,
          incentivePts: Math.max(0, parseInt(incentivePts) || 0),
          postedAt: e.clientTs,
          status: "open",
          autoPosted: false,
          flagReason: null,
        };
        return { ...s, marketplace: [...s.marketplace, listing] };
      },

      "marketplace.take": (s, e) => {
        const { listingId } = e.payload || {};
        const taker = uidVal(e.localUid);
        if (!listingId || taker == null) return s;
        const listing = s.marketplace.find(l => l.id === listingId);
        if (!listing || listing.status !== "open") return s;
        const day = s.shifts[listing.dateKey];
        const entry = day?.[listing.slotId];
        if (!entry) return s;
        let next = {
          ...s,
          shifts: {
            ...s.shifts,
            [listing.dateKey]: {
              ...day,
              [listing.slotId]: { ...entry, uid: taker, source: "marketplace", takenFrom: listing.sellerId, confirm: null },
            },
          },
        };
        if (listing.incentivePts > 0) {
          next = {
            ...next,
            users: next.users.map(u => {
              if (String(u.id) === String(listing.sellerId)) {
                return { ...u, points: Math.max(0, (u.points || 0) - listing.incentivePts) };
              }
              if (String(u.id) === String(taker)) {
                return { ...u, points: (u.points || 0) + listing.incentivePts };
              }
              return u;
            }),
          };
        }
        next = {
          ...next,
          marketplace: next.marketplace.map(l => l.id === listingId
            ? {
                ...l,
                status: "taken",
                takenBy: taker,
                takenAt: e.clientTs,
                tradeOffers: (l.tradeOffers || []).map(o => o.status === "pending" ? { ...o, status: "stale" } : o),
              }
            : l),
        };
        return next;
      },

      "marketplace.cancel": (s, e) => {
        const { listingId } = e.payload || {};
        if (!listingId) return s;
        const listing = s.marketplace.find(l => l.id === listingId);
        if (!listing || listing.status !== "open") return s;
        return {
          ...s,
          marketplace: s.marketplace.map(l => l.id === listingId
            ? {
                ...l,
                status: "cancelled",
                tradeOffers: (l.tradeOffers || []).map(o => o.status === "pending" ? { ...o, status: "stale" } : o),
              }
            : l),
        };
      },

      "trade.offer-post": (s, e) => {
        const { offerId, listingId, fromUid, dateKey, slotId, incentivePts } = e.payload || {};
        if (!offerId || !listingId) return s;
        const listing = s.marketplace.find(l => l.id === listingId);
        if (!listing || listing.status !== "open") return s;
        if ((listing.tradeOffers || []).some(o => o.id === offerId)) return s;
        const offer = {
          id: offerId,
          offererId: fromUid,
          offererDateKey: dateKey,
          offererSlotId: slotId,
          incentivePts: Math.max(0, parseInt(incentivePts) || 0),
          postedAt: e.clientTs,
          status: "pending",
        };
        return {
          ...s,
          marketplace: s.marketplace.map(l => l.id === listingId
            ? { ...l, tradeOffers: [...(l.tradeOffers || []), offer] }
            : l),
        };
      },

      "trade.offer-accept": (s, e) => {
        const p = e.payload || {};
        const { offerId, listingId, aDate, aSlot, aUid, bDate, bSlot, bUid, pointsTransferred } = p;
        if (!offerId || !listingId) return s;
        const listing = s.marketplace.find(l => l.id === listingId);
        if (!listing) return s;
        const aDay = s.shifts[aDate];
        const bDay = s.shifts[bDate];
        const aEntry = aDay?.[aSlot];
        const bEntry = bDay?.[bSlot];
        if (!aEntry || !bEntry) return s;
        let next = {
          ...s,
          shifts: {
            ...s.shifts,
            [aDate]: { ...aDay, [aSlot]: { ...aEntry, uid: uidVal(bUid), source: "trade", swappedFrom: uidVal(aUid), confirm: null, flagReason: null } },
            [bDate]: { ...(s.shifts[bDate] || {}), [bSlot]: { ...bEntry, uid: uidVal(aUid), source: "trade", swappedFrom: uidVal(bUid), confirm: null, flagReason: null } },
          },
        };
        if (pointsTransferred && Object.keys(pointsTransferred).length) {
          next = {
            ...next,
            users: next.users.map(u => {
              const delta = pointsTransferred[String(u.id)] ?? pointsTransferred[u.id] ?? 0;
              if (delta === 0) return u;
              return { ...u, points: Math.max(0, (u.points || 0) + delta) };
            }),
          };
        }
        next = {
          ...next,
          marketplace: next.marketplace.map(l => l.id === listingId
            ? {
                ...l,
                status: "traded",
                takenBy: bUid,
                takenAt: e.clientTs,
                tradeOffers: (l.tradeOffers || []).map(o =>
                  o.id === offerId ? { ...o, status: "accepted" }
                                  : (o.status === "pending" ? { ...o, status: "declined" } : o)
                ),
              }
            : l),
        };
        return next;
      },

      "trade.offer-decline": (s, e) => {
        const { offerId, listingId, status } = e.payload || {};
        if (!offerId) return s;
        // Allow lookup by listingId (preferred) or by scanning offers (fallback for older payloads).
        const target = listingId
          ? s.marketplace.find(l => l.id === listingId)
          : s.marketplace.find(l => (l.tradeOffers || []).some(o => o.id === offerId));
        if (!target) return s;
        const newStatus = status || "declined";
        return {
          ...s,
          marketplace: s.marketplace.map(l => l.id === target.id
            ? { ...l, tradeOffers: (l.tradeOffers || []).map(o => o.id === offerId ? { ...o, status: newStatus } : o) }
            : l),
        };
      },

      "incentive.open-set": (s, e) => {
        const { dateKey, slotId, points } = e.payload || {};
        if (!dateKey || slotId == null) return s;
        const pts = Math.max(0, parseInt(points) || 0);
        const next = { ...s.openIncentives };
        if (pts > 0) {
          next[dateKey] = { ...(next[dateKey] || {}), [slotId]: pts };
        } else if (next[dateKey]?.[slotId] != null || next[dateKey]?.[String(slotId)] != null) {
          const day = { ...next[dateKey] };
          delete day[slotId];
          delete day[String(slotId)];
          if (Object.keys(day).length) next[dateKey] = day;
          else delete next[dateKey];
        } else {
          return s;
        }
        return { ...s, openIncentives: next };
      },

      "config.update": (s, e) => {
        const patch = e.payload?.patch;
        if (!patch || typeof patch !== "object") return s;
        return { ...s, config: { ...s.config, ...patch } };
      },

      "user.create": (s, e) => {
        const u = e.payload?.user;
        if (!u || u.id == null) return s;
        if (s.users.some(x => x.id === u.id)) return s;
        return { ...s, users: [...s.users, u] };
      },

      "user.update": (s, e) => {
        const { uid, patch } = e.payload || {};
        if (uid == null || !patch || typeof patch !== "object") return s;
        return {
          ...s,
          users: s.users.map(u => String(u.id) === String(uid) ? { ...u, ...patch } : u),
        };
      },

      "user.delete": (s, e) => {
        const { uid, cascadeShifts } = e.payload || {};
        if (uid == null) return s;
        const match = u => String(u.id) === String(uid);
        let next = { ...s, users: s.users.filter(u => !match(u)) };
        if (Array.isArray(cascadeShifts) && cascadeShifts.length) {
          const drop = new Set(cascadeShifts.map(c => `${c.dateKey}::${c.slotId}`));
          const nextShifts = {};
          for (const [k, day] of Object.entries(s.shifts)) {
            const cleaned = {};
            for (const [sid, ent] of Object.entries(day)) {
              if (drop.has(`${k}::${sid}`)) continue;
              cleaned[sid] = ent;
            }
            if (Object.keys(cleaned).length) nextShifts[k] = cleaned;
          }
          next = { ...next, shifts: nextShifts };
        }
        if (next.unavailability[uid] !== undefined || next.unavailability[String(uid)] !== undefined) {
          const u = { ...next.unavailability };
          delete u[uid];
          delete u[String(uid)];
          next = { ...next, unavailability: u };
        }
        if (next.preferences[uid] !== undefined || next.preferences[String(uid)] !== undefined) {
          const p = { ...next.preferences };
          delete p[uid];
          delete p[String(uid)];
          next = { ...next, preferences: p };
        }
        return next;
      },

      "snapshot.bootstrap": (s) => s,  // placeholder; reserved for D.4 future use
    };

    function applyEvent(state, evt) {
      if (!evt || !evt.id) return state;
      if (state.appliedEventIds && state.appliedEventIds.includes(evt.id)) return state;
      const h = EVENT_HANDLERS[evt.type];
      if (!h) return state;  // forward-compat: unknown event type is a no-op
      const next = h(state, evt);
      return { ...next, appliedEventIds: trackAppliedEventId(state.appliedEventIds, evt.id) };
    }

    // Normalize state for diffing: sort arrays-of-{id} by id, sort object keys.
    function normalizeForDiff(v) {
      if (Array.isArray(v)) {
        const items = v.length && v.every(x => x && typeof x === "object" && "id" in x)
          ? [...v].sort((a, b) => String(a.id).localeCompare(String(b.id)))
          : v;
        return items.map(normalizeForDiff);
      }
      if (v && typeof v === "object") {
        const sorted = {};
        for (const k of Object.keys(v).sort()) sorted[k] = normalizeForDiff(v[k]);
        return sorted;
      }
      return v;
    }

    function diffState(replayed, live) {
      const slices = ["users","shifts","unavailability","preferences","topOptions","marketplace","openIncentives","config"];
      const out = [];
      for (const k of slices) {
        const a = normalizeForDiff(replayed[k]);
        const b = normalizeForDiff(live[k]);
        if (JSON.stringify(a) !== JSON.stringify(b)) {
          out.push({ slice: k, replayed: a, live: b });
        }
      }
      return out;
    }
